<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AceStream</title>
</head>
<body style="text-align:center;padding:50px;font-family:Arial;">
    <h1>🔴 LIVE ▶️ Запуск...</h1>
    <script>
        const path = window.location.pathname;
        const streamId = path.split('/').pop();
        if (streamId.length === 40) {
            setTimeout(() => {
                window.location.href = `acestream://${streamId}`;
            }, 300);
        }
    </script>
</body>
</html>

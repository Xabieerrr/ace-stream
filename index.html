<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AceStream Redirect</title>
</head>
<body style="font-family: Arial; text-align: center; padding: 50px;">
    <h1>🔴 LIVE ▶️</h1>
    <p>Запуск трансляции...</p>
    
    <script>
        // Извлекаем AceStream ID из URL
        const path = window.location.pathname;
        const streamId = path.split('/').pop();
        
        // Проверяем валидность ID (40 hex символов)
        if (streamId && streamId.length === 40 && /^[a-f0-9]{40}$/i.test(streamId)) {
            setTimeout(() => {
                window.location.href = `acestream://${streamId}`;
            }, 500);
        } else {
            document.body.innerHTML += '<p style="color:red;">❌ Неверная ссылка</p>';
        }
    </script>
</body>
</html>
